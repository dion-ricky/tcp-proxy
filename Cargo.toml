[package]
name = "tcp-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive", "env"] }
dashmap = "6.2.1"
futures-util = { version = "0.3", features = ["sink"] }
hex = "0.4.3"
hmac = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "macros", "rt-multi-thread"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
